name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROIDSDK: /usr/local/lib/android/sdk
      ANDROIDAPI: '35'
      NDKAPI: '23'
      ANDROIDNDKVER: '28.2.13676358'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"
          test -f "$ANDROID_HOME/ndk/28.2.13676358/source.properties"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip python3-venv autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install Python build tools
        run: |
          python3 -m pip install --user --upgrade pip setuptools wheel
          python3 -m pip install --user buildozer cython==0.29.34
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Buildozer SDK and licenses
        shell: bash
        run: |
          set -euxo pipefail
          PLATFORM="$HOME/.buildozer/android/platform"
          mkdir -p "$PLATFORM"
          rm -rf "$PLATFORM/android-sdk"
          ln -s "$ANDROID_HOME" "$PLATFORM/android-sdk"
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"
          if [ -d "$ANDROID_HOME/licenses" ]; then
            cp -a "$ANDROID_HOME/licenses/." "$HOME/.buildozer/android/platform/android-sdk/licenses/" || true
          fi
          printf '%s\n' 'd56f5187479451eabf01fb78af6dfcb131a6481e' > "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license"
          test -L "$PLATFORM/android-sdk"
          test -x "$PLATFORM/android-sdk/build-tools/35.0.0/aidl"
          test -f "$PLATFORM/android-sdk/ndk/28.2.13676358/source.properties"

      - name: Build APK with Buildozer
        shell: bash
        run: |
          set -euxo pipefail
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MegaSenaAI-APK
          path: bin/*.apk
          if-no-files-found: error
